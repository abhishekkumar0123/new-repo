name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Supabase build configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$NEXT_PUBLIC_SUPABASE_URL" ]]; then
            echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL in GitHub Actions Secrets or Variables"
            exit 1
          fi
          if [[ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing NEXT_PUBLIC_SUPABASE_ANON_KEY in GitHub Actions Secrets or Variables"
            exit 1
          fi
      - name: Build static export
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_THREAT_INTEL_PROXY_URL: ${{ vars.NEXT_PUBLIC_THREAT_INTEL_PROXY_URL || 'https://irzlulgjjfwlsjnxplru.supabase.co/functions/v1/threat-intel-proxy' }}
          NEXT_PUBLIC_DOMAIN_INTEL_PROXY_URL: ${{ vars.NEXT_PUBLIC_DOMAIN_INTEL_PROXY_URL || 'https://irzlulgjjfwlsjnxplru.supabase.co/functions/v1/domain-intel-proxy' }}
          NEXT_PUBLIC_URL_ANALYZER_PROXY_URL: ${{ vars.NEXT_PUBLIC_URL_ANALYZER_PROXY_URL || 'https://irzlulgjjfwlsjnxplru.supabase.co/functions/v1/url-analyzer-proxy' }}
          NEXT_PUBLIC_HASH_LOOKUP_PROXY_URL: ${{ vars.NEXT_PUBLIC_HASH_LOOKUP_PROXY_URL || 'https://irzlulgjjfwlsjnxplru.supabase.co/functions/v1/hash-lookup-proxy' }}
          NEXT_PUBLIC_IOC_ENRICHMENT_PROXY_URL: ${{ vars.NEXT_PUBLIC_IOC_ENRICHMENT_PROXY_URL || 'https://irzlulgjjfwlsjnxplru.supabase.co/functions/v1/ioc-enrichment-proxy' }}
          NEXT_PUBLIC_CERT_INSPECTOR_PROXY_URL: ${{ vars.NEXT_PUBLIC_CERT_INSPECTOR_PROXY_URL || 'https://irzlulgjjfwlsjnxplru.supabase.co/functions/v1/cert-inspector-proxy' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
